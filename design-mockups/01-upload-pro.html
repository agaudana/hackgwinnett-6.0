<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthLens - Upload</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Atkinson Hyperlegible', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0891B2;
            background-image:
                radial-gradient(at 20% 30%, rgba(102, 126, 234, 0.3) 0px, transparent 50%),
                radial-gradient(at 80% 0%, rgba(118, 75, 162, 0.25) 0px, transparent 50%),
                radial-gradient(at 0% 50%, rgba(34, 211, 238, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.25) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Mesh gradient background */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.05) 100%),
                radial-gradient(ellipse at top left, rgba(102, 126, 234, 0.2), transparent 60%),
                radial-gradient(ellipse at bottom right, rgba(5, 150, 105, 0.2), transparent 60%);
        }

        .header {
            padding: 32px 24px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 16px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
        }

        .main-content {
            flex: 1;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .hero-icon {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .hero-icon svg {
            width: 56px;
            height: 56px;
            stroke: white;
            stroke-width: 2.5;
        }

        .heading {
            font-size: 34px;
            font-weight: 700;
            color: white;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .subheading {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
        }

        .actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .action-button {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 28px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .action-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .action-button:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .action-button:hover::before {
            opacity: 1;
        }

        .action-button:focus {
            outline: 3px solid rgba(255, 255, 255, 0.6);
            outline-offset: 3px;
        }

        .action-icon {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-icon svg {
            width: 32px;
            height: 32px;
            stroke: white;
            stroke-width: 2.5;
        }

        .action-text {
            flex: 1;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .action-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            color: white;
        }

        .action-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
        }

        .help-section {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .help-section:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .help-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .help-icon svg {
            width: 22px;
            height: 22px;
            stroke: white;
            stroke-width: 2.5;
        }

        .help-text {
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 400px) {
            .heading { font-size: 28px; }
            .action-title { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <div class="header">
        <div class="logo-container">
            <div class="logo">HealthLens</div>
        </div>
        <div class="tagline">Your medical documents, simplified</div>
    </div>

    <div class="main-content">
        <div class="hero-card">
            <div class="hero-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
                    <circle cx="12" cy="13" r="3"></circle>
                </svg>
            </div>
            <h1 class="heading">Snap Your Documents</h1>
            <p class="subheading">Upload your medical paperwork and get a clear, simple explanation in seconds</p>
        </div>

        <div class="actions">
            <button class="action-button" aria-label="Take a single photo of your document">
                <div class="action-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
                        <circle cx="12" cy="13" r="3"></circle>
                    </svg>
                </div>
                <div class="action-text">
                    <div class="action-title">Take Photo</div>
                    <div class="action-subtitle">Quick single scan</div>
                </div>
            </button>

            <button class="action-button" aria-label="Upload multiple pages of documents">
                <div class="action-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    </svg>
                </div>
                <div class="action-text">
                    <div class="action-title">Multiple Pages</div>
                    <div class="action-subtitle">Scan full document set</div>
                </div>
            </button>
        </div>

        <div class="help-section">
            <div class="help-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <div class="help-text">What can I upload?</div>
        </div>
    </div>
</body>
</html>
