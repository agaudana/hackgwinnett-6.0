<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthLens - Processing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Atkinson Hyperlegible', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0891B2;
            background-image:
                radial-gradient(at 20% 30%, rgba(102, 126, 234, 0.3) 0px, transparent 50%),
                radial-gradient(at 80% 0%, rgba(118, 75, 162, 0.25) 0px, transparent 50%),
                radial-gradient(at 0% 50%, rgba(34, 211, 238, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.25) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }

        .processing-container {
            text-align: center;
            padding: 48px 32px;
            position: relative;
            z-index: 1;
            max-width: 500px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            padding: 48px 36px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .scanner-icon {
            width: 140px;
            height: 160px;
            margin: 0 auto 40px;
            position: relative;
        }

        .document {
            width: 140px;
            height: 160px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .document-lines {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .line {
            height: 4px;
            background: #cbd5e1;
            border-radius: 2px;
        }

        .line:nth-child(1) { width: 100%; }
        .line:nth-child(2) { width: 85%; }
        .line:nth-child(3) { width: 95%; }
        .line:nth-child(4) { width: 60%; }
        .line:nth-child(5) { width: 90%; }
        .line:nth-child(6) { width: 75%; }

        .scan-line {
            position: absolute;
            left: 10%;
            right: 10%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(8, 145, 178, 0.8), rgba(8, 145, 178, 1), rgba(8, 145, 178, 0.8), transparent);
            box-shadow: 0 0 20px rgba(8, 145, 178, 0.8);
            animation: scan 2.5s ease-in-out infinite;
        }

        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 85%; opacity: 0; }
        }

        .status-text {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .progress-ring {
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            position: relative;
        }

        .progress-ring-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .subtitle {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
        }

        .stats {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        @media (prefers-reduced-motion: reduce) {
            .scan-line, .progress-ring-circle {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="processing-container" role="status" aria-live="polite">
        <div class="glass-card">
            <div class="scanner-icon">
                <div class="document">
                    <div class="document-lines">
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                    <div class="scan-line"></div>
                </div>
            </div>

            <div class="status-text">Reading Your Document</div>

            <div class="progress-ring">
                <div class="progress-ring-circle"></div>
            </div>

            <div class="subtitle">Analyzing medical terminology</div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value">247</div>
                    <div class="stat-label">Words</div>
                </div>
                <div class="stat">
                    <div class="stat-value">12</div>
                    <div class="stat-label">Terms</div>
                </div>
                <div class="stat">
                    <div class="stat-value">4</div>
                    <div class="stat-label">Actions</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
